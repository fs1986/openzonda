name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # La UI se testea sin escritorio: Qt en modo offscreen sirve igual para verificar
  # construcción de ventanas, geometría y persistencia de settings.
  QT_QPA_PLATFORM: offscreen

jobs:
  quality:
    name: Lint · Types · Tests · Capas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Sin fail-fast: si Windows rompe, queremos ver igualmente el resultado de
      # Linux (y al revés) para saber si el fallo es del SO o del cambio.
      fail-fast: false
      matrix:
        # Windows es el SO objetivo del producto (ctypes sobre wlanapi.dll,
        # PyInstaller, WiX). Linux se mantiene porque es más rápido y detecta
        # dependencias accidentales de rutas o mayúsculas de Windows.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Versión fijada a propósito: el uv.lock declara un formato de lock
          # concreto y un uv más nuevo podría reescribirlo. Subir esta versión
          # es un cambio deliberado, con su regeneración del lock.
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true

      - name: Dependencias de sistema para Qt (solo Linux)
        # PySide6 enlaza contra estas bibliotecas incluso en modo offscreen; en Windows
        # vienen con el propio wheel.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Sync (dev + UI, lockfile congelado)
        # --locked falla si uv.lock no concuerda con pyproject.toml, en lugar de
        # actualizarlo en silencio. Sin esto el lockfile no garantiza nada.
        run: uv sync --locked --group dev --extra ui

      - name: Ruff (lint + formato)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict en núcleo)
        run: uv run mypy packages/domain packages/rf_engine --strict

      - name: Contratos de capas (import-linter)
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  bundle:
    name: Bundle PyInstaller + smoke test
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          # El spec deriva la versión de `git describe --tags`; sin historial completo
          # el bundle se etiquetaría siempre como desarrollo.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true

      - name: Sync (build + UI)
        run: uv sync --locked --group build --extra ui

      - name: Construir bundle onedir
        run: uv run pyinstaller packaging/openzonda.spec --noconfirm

      - name: Smoke test del bundle
        # Arranca el ejecutable real con su event loop, verifica el código de salida,
        # el presupuesto de tamaño y que el log sea JSON lines válido.
        shell: pwsh
        run: ./scripts/smoke_local.ps1

      - name: Publicar el bundle como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenZonda-onedir-${{ github.sha }}
          path: dist/OpenZonda
          retention-days: 14
