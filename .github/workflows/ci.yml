name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Tests · Capas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync (dev)
        run: uv sync --group dev

      - name: Ruff (lint + formato)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict en núcleo)
        run: uv run mypy packages/domain packages/rf_engine --strict

      - name: Contratos de capas (import-linter)
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
